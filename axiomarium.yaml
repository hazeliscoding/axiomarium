# How axm treats this repo. Checked against schemas/axiomarium.schema.json.
doctor:
  # Instruction files that are broken on purpose: the harness scenarios, the finding fixtures, and the repos eval
  # cases start from.
  ignore:
    - scenarios/
    - findings/*/fixtures/
    - "*/*/evals/*/*/repo/"

# The checks axm evidence tracks. The tests read nearly every folder, so they cover every file git sees.
evidence:
  checks:
    - name: tests
      run: [dotnet test]
    - name: format
      run: [dotnet format]
