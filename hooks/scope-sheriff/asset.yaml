# yaml-language-server: $schema=../../schemas/asset.schema.json
name: scope-sheriff
kind: hook
version: 0.1.0
description: >-
  Warns the agent when an edit lands outside the task's declared scope and asks
  it to say why, instead of blocking the edit.
maturity: experimental
supports:
  claude-code: experimental
permissions:
  filesystem: read
  shell: none
  network: none
side_effects: none
inputs:
  - hook-input
  - task-scope
outputs:
  - scope-warning
evals:
  trigger: false
  behavioral: true
  regression: false
hook:
  event: after-edit
  command: axm hook scope-sheriff
  response: warn
