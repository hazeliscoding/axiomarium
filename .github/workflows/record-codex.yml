name: Record Codex

# Codex on Windows finds ~/.agents/skills in the real profile folder whatever HOME says, so Codex is
# recorded here, on Linux, offline and without a login. When a recording differs from the committed one,
# the job fails: download the codex-recordings artifact, copy it over scenarios/, look at the diff and commit it.
on:
  pull_request:
    paths:
      - scenarios/**
      - tools/Axiomarium.GroundTruth/**
      - .github/workflows/record-codex.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      # The version the Codex model is confirmed against, which a test holds to CodexModel.ConfirmedWith.
      - name: Install Codex
        run: npm install -g @openai/codex@0.156.1
      - name: Record Codex
        run: dotnet run --project tools/Axiomarium.GroundTruth -- --harness codex
      - name: Check the recordings are committed
        run: |
          if [ -n "$(git status --porcelain -- scenarios)" ]; then
            git status --short -- scenarios
            git diff -- scenarios
            echo "::error::Codex recorded something the committed expected.json files don't have. Download the codex-recordings artifact, copy it over scenarios/, check the diff and commit it."
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: codex-recordings
          path: scenarios/*/expected.json
