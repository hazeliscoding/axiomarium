name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            binary: out/axm
          - os: windows-latest
            rid: win-x64
            binary: out/axm.exe
          - os: macos-latest
            rid: osx-arm64
            binary: out/axm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Check formatting
        run: dotnet format axiomarium.slnx --verify-no-changes
      - name: Build and test
        run: dotnet test --project tests/Axiomarium.Tests
      - name: Install the native toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      # Trim and AOT warnings are errors, so this fails on any IL2xxx or IL3xxx warning.
      - name: Publish NativeAOT
        run: dotnet publish src/Axiomarium.Cli -c Release -r ${{ matrix.rid }} -o out
      - name: Test the published binary
        run: dotnet test --project tests/Axiomarium.Tests -- --filter-class Axiomarium.Tests.Cli.NativeBinaryTests
        env:
          AXM_BINARY: ${{ github.workspace }}/${{ matrix.binary }}
      - name: Run axm doctor on this repo
        run: ./${{ matrix.binary }} doctor
      # The session doctor runs as every Claude Code session starts, so the native binary has to answer
      # within 1 s, cold, on this repo. A broken repo is the positive control: it has to speak up there.
      - name: Time the session doctor hook
        shell: pwsh
        run: |
          $binary = (Resolve-Path "./${{ matrix.binary }}").Path

          # Only the process is timed: building the payload and PowerShell's first pipe cost seconds on a cold runner.
          function Invoke-SessionDoctor([string] $cwd) {
            $payload = @{ session_id = "ci"; transcript_path = ""; cwd = $cwd; hook_event_name = "SessionStart"; source = "startup" } | ConvertTo-Json -Compress
            $start = [Diagnostics.ProcessStartInfo]::new($binary)
            "hook", "session-doctor" | ForEach-Object { $start.ArgumentList.Add($_) }
            $start.RedirectStandardInput = $true
            $start.RedirectStandardOutput = $true
            $watch = [Diagnostics.Stopwatch]::StartNew()
            $process = [Diagnostics.Process]::Start($start)
            $process.StandardInput.Write($payload)
            $process.StandardInput.Close()
            $reply = $process.StandardOutput.ReadToEnd()
            $process.WaitForExit()
            $watch.Stop()
            if ($process.ExitCode -ne 0) { throw "session-doctor exited with $($process.ExitCode)" }
            return @{ Reply = $reply.Trim(); Milliseconds = $watch.ElapsedMilliseconds }
          }

          $quiet = Invoke-SessionDoctor $PWD.Path
          if ($quiet.Reply) { throw "session-doctor spoke up on this repo: $($quiet.Reply)" }
          if ($quiet.Milliseconds -ge 1000) { throw "session-doctor took $($quiet.Milliseconds) ms, over 1 s" }
          "session-doctor took $($quiet.Milliseconds) ms on this repo"

          $broken = Join-Path ([IO.Path]::GetTempPath()) "axm-broken-$([guid]::NewGuid().ToString('N').Substring(0, 8))"
          New-Item -ItemType Directory -Path (Join-Path $broken ".git") | Out-Null
          Set-Content -Path (Join-Path $broken "CLAUDE.md") -Value "project"
          Set-Content -Path (Join-Path $broken "AGENTS.md") -Value "agents"
          $notice = (Invoke-SessionDoctor $broken).Reply
          if ($notice -notmatch "agents-md-hidden") { throw "session-doctor stayed silent on a broken repo: $notice" }
          "session-doctor spoke up on a broken repo"
